name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Install system lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Go lint tools
        run: bash scripts/install-ci-tools.sh

      - name: Run checks
        run: npm run check
