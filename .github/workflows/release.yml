name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install system lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run checks
        run: corepack pnpm run check

      - name: Detect pending changesets
        id: pending-changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release pull request
        uses: changesets/action@v1
        if: steps.pending-changesets.outputs.has_changesets == 'true'
        with:
          version: corepack pnpm run version-packages
          title: "chore: release"
          commit: "chore: release"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        if: >-
          steps.pending-changesets.outputs.has_changesets == 'false' &&
          (github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.head_commit.message, 'chore: release'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack pnpm run release:github
