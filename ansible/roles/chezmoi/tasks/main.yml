---
- name: Validate chezmoi mode
  ansible.builtin.fail:
    msg: "chezmoi_mode must be one of: none, defaults, user-repo"
  when: chezmoi_mode not in ["none", "defaults", "user-repo"]

- name: Validate user chezmoi repo
  ansible.builtin.fail:
    msg: "chezmoi_repo is required when chezmoi_mode is user-repo"
  when:
    - chezmoi_mode == "user-repo"
    - chezmoi_repo | length == 0

- name: Install chezmoi
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if ! command -v chezmoi >/dev/null 2>&1; then
      sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
    fi
  args:
    executable: /bin/bash
    creates: "{{ devvm_home }}/.local/bin/chezmoi"
  when: chezmoi_mode != "none"

- name: Ensure chezmoi config directory exists
  become: false
  ansible.builtin.file:
    path: "{{ devvm_home }}/.config/chezmoi"
    state: directory
    mode: "0755"
  when: chezmoi_mode != "none"

- name: Write chezmoi machine config
  become: false
  ansible.builtin.copy:
    dest: "{{ devvm_home }}/.config/chezmoi/chezmoi.toml"
    mode: "0600"
    content: |
      [data]
          name = "{{ devvm_name }}"
          devvm = true
          codeDir = "{{ code_dir }}"
  when: chezmoi_mode != "none"

- name: Copy default chezmoi source
  become: false
  ansible.builtin.copy:
    src: "{{ devvm_core }}/defaults/chezmoi/"
    dest: "{{ devvm_home }}/.local/share/chezmoi/"
    mode: preserve
  when: chezmoi_mode == "defaults"

- name: Initialize chezmoi from user repo
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -d "$HOME/.local/share/chezmoi/.git" ]; then
      chezmoi init --branch {{ chezmoi_branch | quote }} {{ chezmoi_repo | quote }}
    fi
  args:
    executable: /bin/bash
  when:
    - chezmoi_mode == "user-repo"

- name: Update chezmoi source from repo
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    chezmoi git pull -- --ff-only
  args:
    executable: /bin/bash
  when:
    - chezmoi_mode == "user-repo"

- name: Check chezmoi dotfile status
  become: false
  ansible.builtin.command: chezmoi status
  register: chezmoi_status
  changed_when: false
  when: chezmoi_mode != "none"

- name: Apply chezmoi dotfiles
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    chezmoi apply {{ chezmoi_apply_args | default('') }}
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - chezmoi_mode != "none"
    - chezmoi_status.stdout | length > 0
