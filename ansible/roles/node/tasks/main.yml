---
- name: Install fnm
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if ! command -v fnm >/dev/null 2>&1; then
      curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell
    fi
  args:
    executable: /bin/bash
    creates: "{{ devvm_home }}/.local/share/fnm/fnm"
  when: >
    (node_version | default("", true) | length > 0) or (devvm_role != "ai" and
    ((ai_tools | default("", true) | length > 0) or (ai_extra_npm_packages | default("",
    true) | length > 0)))

- name: Ensure fnm snippet in shell profiles
  become: false
  ansible.builtin.blockinfile:
    path: "{{ devvm_home }}/{{ item }}"
    create: true
    marker: "# {mark} DEVVM FNM"
    mode: "0644"
    block: |
      export PATH="$HOME/.local/bin:$HOME/.local/share/fnm:$PATH"
      if command -v fnm >/dev/null 2>&1; then
        eval "$(fnm env --use-on-cd --shell bash)"
      fi
  when: >
    (node_version | default("", true) | length > 0) or (devvm_role != "ai" and
    ((ai_tools | default("", true) | length > 0) or (ai_extra_npm_packages | default("",
    true) | length > 0)))
  loop:
    - .profile
    - .bashrc

- name: Install Node and pnpm
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="$HOME/.local/share/fnm:$PATH"
    eval "$(fnm env --use-on-cd --shell bash)"
    fnm install {{ node_version | default("22", true) }}
    fnm default {{ node_version | default("22", true) }}
    fnm use {{ node_version | default("22", true) }}
    corepack enable
    corepack prepare pnpm@10 --activate
  args:
    executable: /bin/bash
  when: >
    (node_version | default("", true) | length > 0) or (devvm_role != "ai" and
    ((ai_tools | default("", true) | length > 0) or (ai_extra_npm_packages | default("",
    true) | length > 0)))
