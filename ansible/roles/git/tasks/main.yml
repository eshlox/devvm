---
- name: Ensure .ssh directory exists
  become: false
  ansible.builtin.file:
    path: "{{ devvm_home }}/.ssh"
    state: directory
    mode: "0700"

- name: Configure git user name
  become: false
  ansible.builtin.ini_file:
    path: "{{ devvm_home }}/.gitconfig"
    section: user
    option: name
    value: "{{ git_user_name }}"
    mode: "0644"
    no_extra_spaces: true
  when: git_user_name | length > 0

- name: Configure git user email
  become: false
  ansible.builtin.ini_file:
    path: "{{ devvm_home }}/.gitconfig"
    section: user
    option: email
    value: "{{ git_user_email }}"
    mode: "0644"
    no_extra_spaces: true
  when: git_user_email | length > 0

- name: Generate VM SSH key if missing
  become: false
  ansible.builtin.command:
    cmd:
      "ssh-keygen -t ed25519 -C {{ devvm_name }}-devvm -f {{ devvm_home
      }}/.ssh/id_ed25519_{{ devvm_name }} -N ''"
    creates: "{{ devvm_home }}/.ssh/id_ed25519_{{ devvm_name }}"

- name: Configure SSH for GitHub with VM key
  become: false
  ansible.builtin.blockinfile:
    path: "{{ devvm_home }}/.ssh/config"
    create: true
    mode: "0600"
    marker: "# {mark} DEVVM {{ devvm_name }} GITHUB"
    block: |
      Host github.com
        HostName github.com
        User git
        IdentityFile ~/.ssh/id_ed25519_{{ devvm_name }}
        IdentitiesOnly yes
