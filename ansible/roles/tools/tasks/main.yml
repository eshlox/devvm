---
- name: Ensure standard config directories exist
  become: false
  ansible.builtin.file:
    path: "{{ devvm_home }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .config
    - .local
    - .local/bin
    - .cache

- name: Ensure GnuPG directory exists
  become: false
  ansible.builtin.file:
    path: "{{ devvm_home }}/.gnupg"
    state: directory
    mode: "0700"
