---
- name: Upgrade Fedora packages
  become: true
  ansible.builtin.dnf5:
    name: "*"
    state: latest
  when: ansible_facts.os_family == "RedHat"

- name: Install base packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ dev_packages_present }}"
    state: present
  when:
    - ansible_facts.os_family == "RedHat"
    - dev_packages_present | length > 0

- name: Remove explicitly unwanted packages
  become: true
  ansible.builtin.dnf5:
    name: "{{ dev_packages_absent }}"
    state: absent
  when:
    - ansible_facts.os_family == "RedHat"
    - dev_packages_absent | length > 0

- name: Ensure local bin exists
  become: false
  ansible.builtin.file:
    path: "{{ devvm_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Ensure code directory exists
  become: true
  ansible.builtin.file:
    path: "{{ code_dir }}"
    state: directory
    owner: "{{ devvm_user }}"
    group: "{{ devvm_user }}"
    mode: "0755"
