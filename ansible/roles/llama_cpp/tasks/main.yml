---
- name: Install llama.cpp from Fedora
  become: true
  ansible.builtin.dnf5:
    name: llama-cpp
    state: present
  when:
    - devvm_role == "ai"
    - ansible_facts.os_family == "RedHat"
  register: llama_cpp_package

- name: Ensure model directory exists
  become: true
  ansible.builtin.file:
    path: "{{ ai_llama_models_dir }}"
    state: directory
    owner: "{{ devvm_user }}"
    group: "{{ devvm_user }}"
    mode: "0755"
  when: devvm_role == "ai"

- name: Download configured GGUF models
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    models={{ ai_llama_models | quote }}
    mkdir -p {{ ai_llama_models_dir | quote }}

    for entry in $models; do
      case "$entry" in
        ""|\#*) continue ;;
      esac

      checksum=""
      extra=""

      if [ "${entry#*|}" != "$entry" ]; then
        IFS='|' read -r name url checksum extra <<ENTRY
    $entry
    ENTRY
      else
        url="$entry"
        clean_url="${url%%\?*}"
        name="$(basename "$clean_url")"
      fi

      [ -n "$name" ] || {
        echo "invalid AI_LLAMA_MODELS entry: $entry" >&2
        exit 1
      }
      [ -n "$url" ] || {
        echo "invalid AI_LLAMA_MODELS entry: $entry" >&2
        exit 1
      }
      [ -z "$extra" ] || {
        echo "invalid AI_LLAMA_MODELS entry: $entry" >&2
        exit 1
      }

      case "$url" in
        https://*) ;;
        *)
          if [ {{ ai_allow_http_model_urls | quote }} != "1" ]; then
            echo "AI model URLs must use https unless AI_ALLOW_HTTP_MODEL_URLS=1: $url" >&2
            exit 1
          fi
          ;;
      esac

      case "$checksum" in
        "")
          echo "AI_LLAMA_MODELS entries must include sha256:<hex>: $entry" >&2
          exit 1
          ;;
        sha256:*)
          expected="${checksum#sha256:}"
          case "$expected" in
            *[!0-9a-fA-F]*|"")
              echo "invalid sha256 checksum in AI_LLAMA_MODELS entry: $entry" >&2
              exit 1
              ;;
          esac
          ;;
        *)
          echo "unsupported checksum in AI_LLAMA_MODELS entry: $entry" >&2
          exit 1
          ;;
      esac

      target="{{ ai_llama_models_dir }}/$name"
      if [ ! -f "$target" ]; then
        curl -fL --continue-at - -o "$target" "$url"
        echo "downloaded:$name"
      fi

      if [ -n "$checksum" ]; then
        printf '%s  %s\n' "$expected" "$target" | sha256sum -c -
      fi
    done
  args:
    executable: /bin/bash
  register: llama_model_downloads
  changed_when: "'downloaded:' in llama_model_downloads.stdout"
  when:
    - devvm_role == "ai"
    - ai_llama_models | length > 0

- name: Validate AI commit model is configured
  ansible.builtin.fail:
    msg:
      "AI_COMMIT_MODEL is required for the AI VM; set it directly or make it the first
      AI_LLAMA_MODELS entry."
  when:
    - devvm_role == "ai"
    - ai_commit_model | length == 0

- name: Validate AI commit model exists
  become: false
  ansible.builtin.stat:
    path: "{{ ai_llama_models_dir }}/{{ ai_commit_model }}"
  register: ai_commit_model_file
  when:
    - devvm_role == "ai"
    - ai_commit_model | length > 0

- name: Fail when AI commit model is missing
  ansible.builtin.fail:
    msg: "AI commit model not found: {{ ai_llama_models_dir }}/{{ ai_commit_model }}"
  when:
    - devvm_role == "ai"
    - ai_commit_model | length > 0
    - not ai_commit_model_file.stat.exists

- name: Install llama-server systemd service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/devvm-llama.service
    mode: "0644"
    content: |
      [Unit]
      Description=DevVM llama.cpp OpenAI-compatible server
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ devvm_user }}
      ExecStart=/usr/bin/llama-server --host 127.0.0.1 --port {{ ai_llama_server_port }} -m {{ ai_llama_models_dir }}/{{ ai_commit_model }} -c {{ ai_llama_ctx_size }} {{ ai_llama_extra_args }}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  register: llama_server_unit
  when: devvm_role == "ai"

- name: Enable llama-server
  become: true
  ansible.builtin.systemd:
    name: devvm-llama.service
    enabled: true
    state: started
    daemon_reload: true
  when: devvm_role == "ai"

- name: Restart llama-server after changes
  become: true
  ansible.builtin.systemd:
    name: devvm-llama.service
    state: restarted
    daemon_reload: true
  when:
    - devvm_role == "ai"
    - (llama_server_unit.changed | default(false)) or (llama_cpp_package.changed |
      default(false)) or (llama_model_downloads.changed | default(false))
