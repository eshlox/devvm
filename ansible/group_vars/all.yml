---
devvm_user: "{{ ansible_user | default(ansible_user_id) }}"
devvm_home:
  "{{ ansible_env.HOME | default(ansible_facts.user_dir) | default('/home/' ~
  devvm_user) }}"
devvm_name: "devvm"
devvm_role: "dev"
code_dir: "/code"

dev_packages_present:
  - git
  - curl
  - ca-certificates
  - openssh-clients
  - gnupg2
  - pinentry
  - jq
  - unzip
  - xz
  - tar
  - gzip
  - python3
  - python3-pip
  - shadow-utils
  - rsync

dev_packages_absent: []

node_version: ""

git_user_name: ""
git_user_email: ""

chezmoi_mode: "defaults"
chezmoi_repo: ""
chezmoi_branch: "main"
chezmoi_apply_args: "--force"

ai_tools: ""
ai_extra_npm_packages: ""
ai_llama_cpp_repo: "https://github.com/ggml-org/llama.cpp.git"
ai_llama_cpp_ref: "master"
ai_llama_models: ""
ai_llama_models_dir: "/models"
ai_llama_server_port: "8080"
ai_llama_ctx_size: "4096"
ai_llama_extra_args: ""
ai_llama_base_url: "http://host.lima.internal:18080/v1"
ai_commit_model: ""
